<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Electrical Engineering Notes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #4a90e2;
    }
    .note {
      margin: 10px;
      padding: 15px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      display: inline-block;
      width: 250px;
    }
    .note a {
      text-decoration: none;
      color: #4a90e2;
    }
    .note:hover {
      background: #f8f8f8;
    }
    .category {
      font-size: 1.2em;
      color: #333;
      margin-top: 20px;
    }
    .search-box {
      margin: 20px 0;
      padding: 10px;
      width: 80%;
      max-width: 300px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    select {
      padding: 10px;
      font-size: 1em;
      margin-bottom: 20px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Electrical Engineering Notes</h1>
  <input type="text" id="search" class="search-box" placeholder="Search notes...">
  <br>
  <select id="semesterSelect">
    <option value="all">All Semesters</option>
    <option value="semester1">Semester 1</option>
    <option value="semester2">Semester 2</option>
    <option value="semester3">Semester 3</option>
  </select>

  <!-- Semester 1 -->
  <div class="category" id="semester1">
    <h2>Semester 1</h2>
    <div class="note">
      <h3>Circuit Theory</h3>
      <a href="notes/circuit_theory.pdf" target="_blank">Download PDF</a>
    </div>
    <div class="note">
      <h3>Mathematics</h3>
      <a href="notes/mathematics.pdf" target="_blank">Download PDF</a>
    </div>
  </div>

  <!-- Semester 2 -->
  <div class="category" id="semester2">
    <h2>Semester 2</h2>
    <div class="note">
      <h3>Power Systems</h3>
      <a href="notes/power_systems.pdf" target="_blank">Download PDF</a>
    </div>
    <div class="note">
      <h3>Control Systems</h3>
      <a href="notes/control_systems.pdf" target="_blank">Download PDF</a>
    </div>
  </div>

  <!-- Semester 3 -->
  <div class="category" id="semester3">
    <h2>Semester 3</h2>
    <div class="note">
      <h3>Signals & Systems</h3>
      <a href="notes/signals_systems.pdf" target="_blank">Download PDF</a>
    </div>
    <div class="note">
      <h3>Electrical Machines</h3>
      <a href="notes/electrical_machines.pdf" target="_blank">Download PDF</a>
    </div>
  </div>

  <script>
    // Search functionality
    document.getElementById('search').addEventListener('input', function () {
      const search = this.value.toLowerCase();
      document.querySelectorAll('.note').forEach(note => {
        note.style.display = note.innerText.toLowerCase().includes(search) ? 'inline-block' : 'none';
      });
    });

    // Semester filter
    document.getElementById('semesterSelect').addEventListener('change', function () {
      const selected = this.value;
      document.querySelectorAll('.category').forEach(cat => {
        cat.style.display = (selected === 'all' || cat.id === selected) ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
