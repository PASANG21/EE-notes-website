<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BE Electrical Notes</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      margin-top: 60px;
      font-size: 40px;
      font-weight: bold;
    }
    .subtitle {
      margin-top: 10px;
      font-size: 18px;
      color: #cccccc;
    }
    .semester-links {
      margin: 50px 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 800px;
    }
    .semester-links a {
      background-color: rgba(255, 255, 255, 0.1);
      color: #00ffff;
      text-decoration: none;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
      transition: all 0.3s;
      border: 1px solid transparent;
    }
    .semester-links a:hover {
      background-color: rgba(0, 255, 255, 0.1);
      color: white;
      border-color: #00ffff;
    }
    footer {
      margin-top: auto;
      padding: 25px 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      text-align: center;
      font-size: 16px;
    }
    footer a {
      color: #00ffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>BE Electrical Notes</h1>
  <div class="subtitle">Browse notes by semester</div>
  <div class="semester-links">
    <a href="sem1/index.html">Semester 1</a>
    <a href="sem2/index.html">Semester 2</a>
    <a href="sem3/index.html">Semester 3</a>
    <a href="sem4/index.html">Semester 4</a>
    <a href="sem5/index.html">Semester 5</a>
    <a href="sem6/index.html">Semester 6</a>
    <a href="sem7/index.html">Semester 7</a>
    <a href="sem8/index.html">Semester 8</a>
  </div>
  <footer>
    Contact: <a href="mailto:khambachepasang@gmail.com">khambachepasang@gmail.com</a>
  </footer>
</body>
</html>
