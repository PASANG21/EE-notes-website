<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BE Notes | Electrical Engineering</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: white;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    p {
      text-align: center;
      margin-bottom: 30px;
    }
    .search-box {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }
    input[type="text"] {
      padding: 10px;
      width: 80%;
      max-width: 400px;
      border-radius: 5px;
      border: none;
    }
    .semester-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    .semester {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      transition: background 0.3s;
    }
    .semester:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    a {
      color: white;
      text-decoration: none;
    }
    footer {
      margin-top: 50px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 20px;
      font-size: 14px;
    }
    .contact {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>BE Electrical Engineering Notes</h1>
  <p>Access semester-wise notes easily</p>

  <div class="search-box">
    <input type="text" placeholder="Search topics (coming soon)" />
  </div>

  <div class="semester-list">
    <div class="semester"><a href="#">Semester 1</a></div>
    <div class="semester"><a href="#">Semester 2</a></div>
    <div class="semester"><a href="#">Semester 3</a></div>
    <div class="semester"><a href="#">Semester 4</a></div>
    <div class="semester"><a href="#">Semester 5</a></div>
    <div class="semester"><a href="#">Semester 6</a></div>
    <div class="semester"><a href="#">Semester 7</a></div>
    <div class="semester"><a href="#">Semester 8</a></div>
  </div>

  <footer>
    <p>&copy; 2025 BE Notes</p>
    <div class="contact">
      Contact: <a href="mailto:khambachepasang@gmail.com">khambachepasang@gmail.com</a>
    </div>
  </footer>
</body>
</html>
