<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BE Electrical Notes</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 18px;
      color: #cccccc;
      margin-bottom: 30px;
    }
    .semester-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 600px;
    }
    .semester-links a {
      background: rgba(255, 255, 255, 0.1);
      color: #00ffff;
      text-decoration: none;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      font-size: 18px;
      transition: 0.3s ease;
    }
    .semester-links a:hover {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }
    footer {
      background: rgba(0, 0, 0, 0.25);
      text-align: center;
      padding: 15px 10px;
      font-size: 15px;
      color: #ccc;
    }
    footer a {
      color: #00ffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>BE Electrical Notes</h1>
    <div class="subtitle">Select your semester:</div>
    <div class="semester-links">
      <a href="sem1/index.html">Semester 1</a>
      <a href="sem2/index.html">Semester 2</a>
      <a href="sem3/index.html">Semester 3</a>
      <a href="sem4/index.html">Semester 4</a>
      <a href="sem5/index.html">Semester 5</a>
      <a href="sem6/index.html">Semester 6</a>
      <a href="sem7/index.html">Semester 7</a>
      <a href="sem8/index.html">Semester 8</a>
    </div>
  </main>
  <footer>
    Contact: <a href="mailto:khambachepasang@gmail.com">khambachepasang@gmail.com</a>
  </footer>
</body>
</html>
