<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Semester 1 Notes</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-top: 50px;
    }
    .pdf-links {
      margin-top: 30px;
      width: 90%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .pdf-links a {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      color: #00ffff;
      text-decoration: none;
      transition: 0.3s;
    }
    .pdf-links a:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
    }
    footer {
      margin-top: auto;
      background: rgba(0, 0, 0, 0.25);
      width: 100%;
      text-align: center;
      padding: 15px 0;
      font-size: 15px;
    }
    footer a {
      color: #00ffff;
    }
  </style>
</head>
<body>
  <h1>Semester 1 Notes</h1>
  <div class="pdf-links">
    <a href="english.pdf" target="_blank">English Notes</a>
  </div>
  <footer>
    Contact: <a href="mailto:khambachepasang@gmail.com">khambachepasang@gmail.com</a>
  </footer>
</body>
</html>
